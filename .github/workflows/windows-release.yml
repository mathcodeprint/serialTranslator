name: Build Windows release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (for example v0.4.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build application and installer
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          cmd /c scripts\build-windows-installer.bat

      - name: Verify frozen runtime dependencies
        shell: pwsh
        run: |
          & "dist\GasWorks-ProLab-Serial-Translator\GasWorks-ProLab-Serial-Translator.exe" --runtime-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serial-Protocol-Translator-Setup
          path: dist-installer/Serial-Protocol-Translator-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "dist-installer/Serial-Protocol-Translator-Setup.exe"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $installer --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $installer --target "$env:GITHUB_SHA" --title "Serial Protocol Translator $env:RELEASE_TAG" --generate-notes
          }
